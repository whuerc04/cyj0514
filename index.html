body::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(2,3,10,.55),rgba(2,3,10,.2) 40%,rgba(2,3,10,.7));pointer-events:none;z-index:-1}
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:20px clamp(16px,4vw,48px)}
.logo{font:800 20px "Noto Sans KR",system-ui,sans-serif;letter-spacing:.02em}
nav{display:flex;gap:4px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:4px;backdrop-filter:blur(10px)}
nav button{border:0;background:none;color:var(--dim);font:inherit;padding:7px 18px;border-radius:999px;cursor:pointer}
nav button[aria-selected=true]{background:var(--ink);color:#0a1024;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{padding:0 clamp(16px,4vw,48px) 60px;max-width:1180px;margin:0 auto}

if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!standalone())$('#inst').hidden=false;
$('#inst').onclick=async()=>{if(dip){dip.prompt();try{await dip.userChoice}catch(e){}dip=null;$('#inst').hidden=true}else toast('Safari 아래쪽 공유 버튼을 누른 뒤 "홈 화면에 추가"를 선택해 주세요.')};
addEventListener('appinstalled',()=>{$('#inst').hidden=true;toast('앱이 설치됐어요.')});
let sess=authOk();
if(sess)owner=true;applyOwner();
loadData().then(()=>{redrawAll();if(restoreY)requestAnimationFrame(()=>scrollTo({top:restoreY,behavior:'instant'}));if(sess)loadDraft().then(ok=>{if(ok)applyOwner();else refreshFromGit()})});
if(location.hash==='#admin'&&!owner){resetModal();$('#lgi').value='';$('#login').hidden=false}
</script></body></html>
